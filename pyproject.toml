[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depcheck"
version = "0.1.0"
description = "Audit project dependencies for common problems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zelvarys" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
depcheck = "depcheck.cli:main"

[tool.setuptools.packages.find]
include = ["depcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]